plugins { id 'com.android.application' }

android {
    namespace 'lk.gedabaduapp'
    compileSdk 35
    defaultConfig {
        applicationId 'lk.gedabaduapp'   // දැනට install කරලා තියෙන app එකේ නමමයි — එතකොට උඩින් update වෙනවා
        minSdk 24
        targetSdk 35
        versionCode 22
        versionName '3.4'
    }
    signingConfigs {
        release {
            def ks = System.getenv('GEDA_KEYSTORE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('GEDA_KEYSTORE_PASSWORD')
                keyAlias System.getenv('GEDA_KEY_ALIAS')
                keyPassword System.getenv('GEDA_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv('GEDA_KEYSTORE') ? signingConfigs.release : signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { checkReleaseBuilds false; abortOnError false }
    buildFeatures { buildConfig true }
}

dependencies {
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
    implementation 'androidx.core:core:1.13.1'
    // kotlin-stdlib versions එකට ගලපනවා (Duplicate class error එක නවත්තන්න)
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
}
